<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIじゃんけん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🤖 AIじゃんけん ✊✌️✋</h1>

        <div class="score-board">
            <p>勝ち: <span id="wins">0</span></p>
            <p>負け: <span id="losses">0</span></p>
            <p>引き分け: <span id="draws">0</span></p>
        </div>

        <div class="game-area">
            <p>あなた: <span id="player-hand">？</span></p>
            <p>AI: <span id="ai-hand">？</span></p>
        </div>

        <h2 id="result">手を選んでください！</h2>

        <div class="buttons">
            <button onclick="play('グー')">✊ グー</button>
            <button onclick="play('チョキ')">✌️ チョキ</button>
            <button onclick="play('パー')">✋ パー</button>
        </div>

        <div class="ai-comment">
            <p id="comment">AIがあなたのクセを学習中...</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
